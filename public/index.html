<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 16px;
        background: #f3f4f6;
      }

      h1 {
        text-align: center;
      }

      #status {
        color: #15803d;
        text-align: center;
      }

      #messages {
        height: 300px;
        overflow-y: auto;
        padding: 12px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      #messages p {
        padding: 10px;
        background: #dbeafe;
        border-radius: 6px;
        overflow-wrap: anywhere;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 12px;
      }

      button {
        padding: 12px 20px;
        cursor: pointer;
      }
      #typing-indicator {
        color: #6b7280;
        font-size: 14px;
        font-style: italic;
        min-height: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Socket.IO Chat</h1>

    <p id="status">Connecting...</p>
    <div id="messages"></div>
    <p id="typing-indicator"></p>
    <form id="chat-form">
      <input
        id="message-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>

    <!-- Socket.IO client library served by our server -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
      // Step 1: Connect to the Socket.IO server
      const socket = io();

      const status = document.getElementById("status");
      const messages = document.getElementById("messages");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("message-input");
      const typingIndicator = document.getElementById("typing-indicator");

      let typingTimeout;

      // Step 2: Connection established
      socket.on("connect", () => {
        status.textContent = "Connected: " + socket.id;
      });

      // Step 3: Send message to server
      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const message = input.value.trim();

        if (!message) return;

        socket.emit("chat-message", message);
        socket.emit("stop-typing");
        clearTimeout(typingTimeout);

        input.value = "";
        input.focus();

      });

      // Tell the server when the user starts typing
      input.addEventListener("input", () => {
        socket.emit("typing...");

        // Reset the timeout whenever the user types again
        clearTimeout(typingTimeout);

        // Tell the server when the user stops typing
        typingTimeout = setTimeout(() => {
          socket.emit("stop-typing");
        }, 1000);
      });

      // Step 4: Receive message from server
      socket.on("chat-message", (message) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = message;
        messages.appendChild(paragraph);
        messages.scrollTop = messages.scrollHeight;
      });

      // Show when another user is typing
      socket.on("typing...", (username) => {
        typingIndicator.textContent = `${username} is typing...`;
      });

      // Hide the typing indicator
      socket.on("stop-typing", () => {
        typingIndicator.textContent = "";
      });

      // Step 5: Handle disconnection
      socket.on("disconnect", () => {
        status.textContent = "Disconnected";
      });
    </script>
  </body>
</html>
